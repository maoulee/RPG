[project]
name = "subgraph-kgqa"
version = "0.1.0"
description = "Unified project layout for the Subgraph KGQA RL agent and graph backend."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "aiohttp",
  "fastapi",
  "httpx",
  "matplotlib",
  "modelscope>=1.37.0",
  "numpy",
  "openai",
  "pandas",
  "pydantic>=1.10,<3",
  "pyyaml",
  "requests",
  "scikit-learn",
  "scipy",
  "sentence-transformers",
  "statsmodels",
  "torch",
  "tqdm",
  "transformers",
  "uvicorn",
  "vllm==0.19.1",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ipython",
]

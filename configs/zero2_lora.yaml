# accelerate ZeRO-2 config: optimizer state sharded across GPUs (NO CPU offload)
# accelerate internally generates the correct DeepSpeed config from these fields.
# - zero_stage 2: shard optimizer states across 2 GPUs (halves GPU memory)
# - NO offload_optimizer_device: keep optimizer on GPU (avoids DeepSpeedCPUAdam
#   'ds_opt_adam' bug; LoRA optimizer is tiny anyway)
# - optimizer itself configured via trl TrainingArguments optim= in the script
compute_environment: LOCAL_MACHINE
debug: false
deepspeed_config:
  deepspeed_multinode_launcher: standard
  offload_optimizer_device: none
  offload_param_device: none
  zero3_init_flag: false
  zero3_save_16bit_model: false
  zero_stage: 2
distributed_type: DEEPSPEED
downcast_bf16: 'no'
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
num_processes: 2
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false

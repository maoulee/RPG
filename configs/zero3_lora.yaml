# accelerate ZeRO-3 config: SHARD model params across GPUs (frees the 18GB base
# that ZeRO-2 duplicates per card) → headroom for batch=2 @ 14336.
# ZeRO-3 gathers params on each forward (comm overhead per step) but enables
# larger batch → net throughput win for memory-bound long-sequence training.
compute_environment: LOCAL_MACHINE
debug: false
deepspeed_config:
  deepspeed_multinode_launcher: standard
  offload_optimizer_device: none
  offload_param_device: none
  zero3_init_flag: true
  zero3_save_16bit_model: true
  zero_stage: 3
distributed_type: DEEPSPEED
downcast_bf16: 'no'
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
num_processes: 2
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false

# accelerate plain-DDP config: NO ZeRO sharding. LoRA optimizer state is tiny
# (~tens of MB), so ZeRO-2's gradient/optimizer sharding only adds per-step
# all-reduce communication without memory benefit. Use for A/B against
# zero2_lora.yaml: same seed/data, compare train_samples_per_second.
compute_environment: LOCAL_MACHINE
debug: false
distributed_type: MULTI_GPU
downcast_bf16: 'no'
gpu_ids: all
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
num_processes: 2
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
